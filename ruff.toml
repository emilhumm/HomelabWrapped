# HA 2026.10 runs on Python 3.14 (mypy checks against it), but ruff writes 3.13 syntax:
# `except (A, B):` reads clearer than 3.14's unparenthesized form, which looks like Python 2.
target-version = "py313"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC", "DTZ"]
ignore = [
  "E501",  # the formatter handles line length
  "PLR0911", "PLR0912", "PLR0913", "PLR2004",
  "RUF012",
]

[lint.per-file-ignores]
"tests/**" = ["DTZ"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false
