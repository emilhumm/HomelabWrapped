name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"  # as requirements_test.txt: a new ruff mustn't fail a commit
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: format --check

  pytest:
    name: Pytest, coverage and mypy (${{ matrix.ha }} Home Assistant)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest HA the test plugin has a release for, and the oldest tested: 2026.10.4
        # (hacs.json allows 2026.10.0; the plugin has no release for 2026.10.0 to 2026.10.3).
        ha: [newest, oldest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install
        run: |
          if [ "${{ matrix.ha }}" = "oldest" ]; then
            pip install "pytest-homeassistant-custom-component==0.13.375" mypy "ruff==0.17.4"
          else
            pip install -r requirements_test.txt
          fi
      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing -p no:cacheprovider
      - name: Strict typing
        if: ${{ !cancelled() }}
        run: mypy

  frontend:
    name: Panel builds and matches the committed bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/homelab_wrapped/frontend/
