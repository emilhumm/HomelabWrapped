# Tool settings only; the integration itself is installed through HACS.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/homelab_wrapped"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/homelab_wrapped"]
# custom_components has no __init__.py; resolve modules from the repo root.
explicit_package_bases = true
strict = true
# Home Assistant re-exports names from its packages without __all__.
implicit_reexport = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
